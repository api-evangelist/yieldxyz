description: |
  Yield.xyz offers three access tiers. Every tier includes the full yield integration
  suite; tiers differ by API rate limit and Optimized Allocator Vault (OAV) deployment
  ceiling. Published pricing figures are not disclosed on the plans page; contact
  sales for Standard/Pro pricing.
sources:
- https://docs.yield.xyz/docs/rate-limits-and-plans
plans:
- id: yieldxyz-trial
  name: Trial
  type: free
  description: Full integration suite at 1 request/sec with up to 3 OAV deployments.
  entries:
  - label: Rate limit
