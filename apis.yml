aid: yieldxyz
name: Yield.xyz
description: 'Yield.xyz (formerly StakeKit) is a non-custodial, on-chain yield infrastructure
  API that lets wallets, custodians, exchanges, and AI agents integrate staking, restaking,
  liquid staking, DeFi lending, vaults, RWA yields, and perpetuals across 80+ networks
  and thousands of yield opportunities through a single standardized interface. The
  REST API discovers yields, constructs complete unsigned transaction flows (enter/exit/manage),
  and returns unified balances while signing and execution stay entirely with the
  developer. It powers platforms including Ledger, Zerion, and Tangem, and ships SDKs,
  an embeddable Widget, an AgentKit MCP server, and packaged agent Skills.'
